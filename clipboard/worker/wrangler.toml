name = "shared-clipboard"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "CLIP"
class_name = "Clipboard"

# SQLite-backed Durable Objects are available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Clipboard"]

# PASSWORD is a secret (set by deploy.sh, never committed).
# ALLOWED_ORIGIN is passed by deploy.sh as --var.
